; =============================================================================
; PlatformIO configuration — uStepper S32 (STM32F401, ARM Cortex-M4 @ 84MHz)
; =============================================================================
;
; BEFORE FIRST BUILD — verify these two settings against your hardware:
;
;   board           — "genericSTM32F401CC" is the closest generic match.
;                     If uStepper provides a custom board JSON in future,
;                     replace this. Run `pio boards stm32` to list options.
;
;   upload_protocol — "dfu" uses the USB-C port (hold BOOT, press RESET).
;                     Change to "stlink" if you have an ST-Link debugger.
;
; LIBRARY — uStepperS32 is fetched directly from GitHub. Pin at a tag/commit
; once confirmed working to avoid upstream breakage.
; =============================================================================

[env:ustepper_s32]
platform  = ststm32
board     = genericSTM32F401CC
framework = arduino

; USB-C DFU upload (BOOT button + RESET to enter bootloader)
upload_protocol = dfu

; Serial monitor baud — must match SERIAL_BAUD_RATE in config.h
monitor_speed = 115200

; uStepperS32 library from GitHub
; TODO: pin to a specific tag once the build is verified, e.g.:
;   https://github.com/uStepper/uStepperS32#v1.0.0
lib_deps =
    https://github.com/uStepper/uStepperS32

; C++14 for scoped enums (enum class) used in state_machine.h
build_flags =
    -std=gnu++14
build_unflags =
    -std=gnu++11
; Localise TIM4_IRQHandler in HardwareTimer.cpp.o so uStepper's handler wins
extra_scripts = post:extra_script.py

; =============================================================================
; Hardware bringup test — flash and monitor to validate physical hardware.
;
; Flash:   pio run -e hw_test -t upload
; Monitor: pio device monitor -e hw_test
;
; Tests (in order):
;   1. Motor connectivity  — jog down 2 s, encoder must register >= 3 mm
;   2. Homing              — drives UP to top endstop, backs off
;   3. Move accuracy (down)— jog down 10 s at 5 mm/s, check encoder vs commanded
;   4. Move accuracy (up)  — jog up  5 s at 5 mm/s, check encoder vs commanded
;
; Wiring diagnostics printed to serial during the run.
; =============================================================================
[env:hw_test]
platform  = ststm32
board     = genericSTM32F401CC
framework = arduino
upload_protocol = dfu
monitor_speed   = 115200
lib_deps =
    https://github.com/uStepper/uStepperS32
build_flags =
    -std=gnu++14
build_unflags =
    -std=gnu++11
; Only compile hw_bringup.cpp — exclude command_parser and any future src files
build_src_filter = -<*> +<hw_bringup.cpp>
; Localise TIM4_IRQHandler in HardwareTimer.cpp.o so uStepper's handler wins
extra_scripts = post:extra_script.py

; =============================================================================
; Endstop diagnostic — no motor library needed, runs on bare Arduino framework.
;
; Flash:   pio run -e endstop_test -t upload
; Monitor: pio device monitor -e endstop_test
;
; Manually trigger each switch.  Send 's' over serial to query current state.
; Output format: ENDSTOP:<name>:<TRIGGERED|RELEASED>  (parseable by Python UI)
; =============================================================================
[env:endstop_test]
platform  = ststm32
board     = genericSTM32F401CC
framework = arduino
upload_protocol = dfu
monitor_speed   = 115200
build_src_filter = -<*> +<endstop_test.cpp>

; =============================================================================
; Native environment — runs unit tests on the host machine, no hardware needed.
; state_machine  → lib/StateMachine/   — auto-included by PlatformIO
; motion_controller → lib/MotionController/ — auto-included by PlatformIO
; config.h        → lib/Config/         — auto-included by PlatformIO
; command_parser is excluded (depends on Arduino.h and missing headers).
; Run with: pio test -e native
; =============================================================================
[env:native]
platform = native
build_src_filter = -<command_parser.cpp>
build_flags = -std=c++14
