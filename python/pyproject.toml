[project]
name = "dip-coater"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pyserial",
    "PyQt6",
    "pyqtgraph",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: tests that require a physical Arduino connected via serial (deselect with '-m not hardware')",
]
